# ============================================================================
# config.properties
# Central place for every setting the framework needs at runtime.
# Read by helper/ConfigReader.java. Any key can be overridden from the command
# line, e.g.  mvn clean test -Dbrowser=firefox -Dheadless=true
# ============================================================================

# Base URL of the application under test (QA environment). BaseClass opens this URL before every test
qaenv=https://www.saucedemo.com

# Browser to launch: chrome, firefox or edge. BrowserFactory reads this value
browser=chrome

# true = run the browser without a visible window (useful on CI servers); false = show the browser
headless=false

# Maximum seconds Selenium waits for a page to finish loading before throwing TimeoutException
pageloadtime=60

# Implicit wait in seconds. Kept at 0 on purpose: we use ONLY explicit waits (WebDriverWait) in BasePage
implicitwait=0

# Maximum seconds an explicit wait (WebDriverWait in BasePage) polls for a condition before failing
explicitwait=10

# true = take a screenshot and attach it to the report when a test FAILS
screenshot_on_failure=true

# true = take a screenshot and attach it to the report when a test PASSES
screenshot_on_success=false

# true = take a screenshot and attach it to the report when a test is SKIPPED
screenshot_on_skip=false

# Number of times to re-run a failed test (reserved for a future RetryAnalyzer; 0 = no retry)
retry=0
