name: UI Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 0,6,12,18 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run TestNG suite
        run: mvn -B clean test -Dsuitefile=testng.xml -Dheadless=true -Dbrowser=chrome

      - name: Upload ChainTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaintest-report
          path: |
            reports/chaintest/
            screenshots/
          if-no-files-found: ignore
