# GitHub Actions workflow: runs the TestNG suite on every push and pull request.
# The ChainTest report and any failure screenshots are uploaded as a build artifact.
name: UI Tests

# When to run: every push, every pull request, manually from the Actions tab,
# and on a schedule four times a day
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # GitHub cron is always UTC. IST = UTC + 5:30, so minute 30 of hours 0, 6, 12, 18 UTC is:
    #   00:30 UTC = 6:00 AM IST
    #   06:30 UTC = 12:00 PM IST
    #   12:30 UTC = 6:00 PM IST
    #   18:30 UTC = 12:00 AM IST (midnight)
    - cron: '30 0,6,12,18 * * *'

jobs:
  test:
    # GitHub-hosted Linux machine; Google Chrome is preinstalled on it
    runs-on: ubuntu-latest

    steps:
      # Download the repository code onto the machine
      - name: Check out code
        uses: actions/checkout@v4

      # Install JDK 21 and cache Maven dependencies between runs
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Run the suite headless (no screen on CI). -D values override config.properties
      - name: Run TestNG suite
        run: mvn -B clean test -Dsuitefile=testng.xml -Dheadless=true -Dbrowser=chrome

      # Keep the HTML report and screenshots, even when tests fail
      - name: Upload ChainTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaintest-report
          path: |
            reports/chaintest/
            screenshots/
          if-no-files-found: ignore
