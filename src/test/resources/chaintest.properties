# ============================================================================
# chaintest.properties
# Settings for the ChainTest reporting library. ChainTest looks for this file
# on the classpath (src/test/resources is copied to target/test-classes).
# ============================================================================

# Project name shown in the report
chaintest.project.name=SauceDemo Hybrid Framework

# ---------------- storage (upload reports to cloud storage) ----------------

# false = do not upload anything to cloud storage; keep reports local
chaintest.storage.service.enabled=false

# Which cloud service to use if enabled: azure-blob or aws-s3
chaintest.storage.service=azure-blob

# S3 bucket or Azure container name (empty because storage is disabled)
chaintest.storage.service.container-name=

# ---------------- generator: chainlp (ChainTest server dashboard) ----------------

# false = do not send results to a ChainLP server (we have none)
chaintest.generator.chainlp.enabled=false

# Class that implements the ChainLP generator
chaintest.generator.chainlp.class-name=com.aventstack.chaintest.generator.ChainLPGenerator

# URL of the ChainLP server
chaintest.generator.chainlp.host.url=http://localhost/

# Seconds to wait for each request to the server
chaintest.generator.chainlp.client.request-timeout-s=30

# Whether to send the HTTP "Expect: 100-continue" header
chaintest.generator.chainlp.client.expect-continue=false

# How many times to retry a failed request to the server
chaintest.generator.chainlp.client.max-retries=3

# Keep embedded screenshots when sending to the server
chaintest.generator.chainlp.persist-embeds=true

# ---------------- generator: simple (the main HTML report) ----------------

# true = generate the standalone HTML report
chaintest.generator.simple.enabled=true

# Title shown at the top of the report and in the browser tab
chaintest.generator.simple.document-title=SauceDemo Automation Report

# Class that implements the simple HTML generator
chaintest.generator.simple.class-name=com.aventstack.chaintest.generator.ChainTestSimpleGenerator

# Where the main report is written, relative to the project root
chaintest.generator.simple.output-file=reports/chaintest/Index.html

# true = bundle CSS/JS inside the report so it opens without internet
chaintest.generator.simple.offline=true

# true = dark colour theme
chaintest.generator.simple.dark-theme=true

# Date/time pattern used in the report
chaintest.generator.simple.datetime-format=yyyy-MM-dd hh:mm:ss a

# Extra JavaScript to inject into the report (none)
chaintest.generator.simple.js=

# Extra CSS to inject into the report (none)
chaintest.generator.simple.css=

# ---------------- generator: email (compact report for emailing) ----------------

# true = also generate an email-friendly summary report
chaintest.generator.email.enabled=true

# Class that implements the email generator
chaintest.generator.email.class-name=com.aventstack.chaintest.generator.ChainTestEmailGenerator

# Where the email report is written
chaintest.generator.email.output-file=reports/chaintest/Email.html

# Date/time pattern used in the email report
chaintest.generator.email.datetime-format=yyyy-MM-dd hh:mm:ss a
